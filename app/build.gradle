plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bench.examassist'
    compileSdk 34

    defaultConfig {
        applicationId "com.bench.examassist"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // all APIs used (AccessibilityService, WindowManager, org.json) are part of Android SDK
}
